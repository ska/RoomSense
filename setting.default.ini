; Template: copied to setting.ini at the first start, then edit setting.ini.
; MQTT interface with AcquaThermoNet: see its docs/SENSOR_GATEWAY_INTERFACE.md.

[MQTT]
; broker host or IP (empty: localhost)
broker_addr=
broker_port=1883
; used only when both are set
broker_uname=
broker_password=
; client id RoomSense-<unique_id> (empty: host name)
unique_id=
; seconds between two messages of a zone, 60-300 (earlier on a 0.1 degC change)
publish_interval_s=120

[LOG]
; relative to setting.ini, empty: no file; rotated at max_kb keeping files old ones
file=log/RoomSense.log
max_kb=512
files=3

[SCREENSAVER]
; seconds without a touch before the screen saver (clock, webcam, summary), 0 = off
idle_s=30
; image shown in the middle (http://..., empty: none) and its reload period
webcam_url=
webcam_refresh_s=60

[WEATHER]
; outdoor weather under the clock of the screen saver, as AcquaThermoNet:
; metno (api.met.no, needs lat and lon; contact: e-mail or URL asked by met.no)
; or wttr (wttr.in, needs location); disabled without them
provider=metno
location=
lat=
lon=
altitude=0
contact=
poll_s=600

[SENSORS]
; one group per BLE sensor: mac, name, zone
; zone: AcquaThermoNet zone name, case sensitive, [A-Za-z0-9_-] (default: name);
; one sensor per zone
salotto\mac=A4:C1:38:00:00:01
salotto\name=salotto
salotto\zone=salotto
ingresso\mac=A4:C1:38:00:00:02
ingresso\name=ingresso
ingresso\zone=ingresso
cameretta\mac=A4:C1:38:00:00:03
cameretta\name=cameretta
cameretta\zone=cameretta
camera\mac=A4:C1:38:00:00:04
camera\name=camera
camera\zone=camera
bagno\mac=A4:C1:38:00:00:05
bagno\name=bagno
bagno\zone=bagno
