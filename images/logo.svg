<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 224" width="200" height="224">
  <title>RoomSense</title>
  <defs>
    <linearGradient id="house" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DB7FF"/>
      <stop offset="1" stop-color="#4FB3A9"/>
    </linearGradient>
    <linearGradient id="mercury" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F28C28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F28C28" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F28C28" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(0,18)">
  <!-- BLE waves above the roof (Sense) -->
  <g fill="none" stroke="#7DB7FF" stroke-width="7" stroke-linecap="round">
    <path d="M85.2 28.5 A17 17 0 0 1 114.8 28.5"/>
    <path d="M72.5 21 A31 31 0 0 1 127.5 21" opacity="0.7"/>
    <path d="M59.8 13.5 A45 45 0 0 1 140.2 13.5" opacity="0.4"/>
  </g>
  <!-- house (Room) -->
  <path d="M100 56 L164 112 V196 H36 V112 Z" fill="#0B1118"/>
  <path d="M24 118 L100 52 L176 118 M40 106 V196 H160 V106" fill="none"
        stroke="url(#house)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- thermometer -->
  <g transform="translate(0,-10)">
  <circle cx="100" cy="166" r="34" fill="url(#glow)"/>
  <path d="M88 166 V104 A12 12 0 0 1 112 104 V166 A20 20 0 1 1 88 166 Z"
        fill="#0B1118" stroke="#E5E7EB" stroke-width="5" stroke-linejoin="round"/>
  <rect x="95" y="118" width="10" height="52" rx="5" fill="url(#mercury)"/>
  <circle cx="100" cy="176" r="12" fill="url(#mercury)"/>
  <g stroke="#9CA3AF" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="110" x2="128" y2="110"/>
    <line x1="120" y1="124" x2="128" y2="124"/>
    <line x1="120" y1="138" x2="128" y2="138"/>
  </g>
  </g>
  </g>
</svg>
